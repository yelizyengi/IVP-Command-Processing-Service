apiVersion: apps/v1
kind: Deployment
metadata:
  name: ivp-command-service
  labels:
    app: ivp-command-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ivp-command-service
  template:
    metadata:
      labels:
        app: ivp-command-service
    spec:
      containers:
        - name: ivp-command-service
          image: ivp-command-service:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: ivp-config
            - secretRef:
                name: ivp-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
